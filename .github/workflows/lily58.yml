          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  lily58-release:
    # Publish only from main; PR / branch runs just keep the build artifacts.
    if: github.ref == 'refs/heads/main'
    needs:
      - lily58-default-helios
      - lily58-vial-helios
      - lily58-vial-keebd-helios
      - lily58-default-svlinky
      - lily58-vial-svlinky
      - lily58-vik-svlinky
      - lily58-default-promicro
      - lily58-default-stemcell
      - lily58-vial-promicro
      - lily58-vial-stemcell
      - lily58-vial-keebd-promicro
      - lily58-vial-keebd-stemcell
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true
      - name: Publish firmware as a rolling release
        # Pinned to a commit SHA (supply-chain hardening); Renovate bumps the
        # SHA + comment via PR. This action runs with contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: lily58-firmware
          name: Lily58 Firmware (latest)
          body: |
            Latest Lily58 QMK firmware, built automatically from `main`.

            The **Vial** variants include rotary-encoder support for the
            Lily58 RE. The same firmware also works on the standard all-switch
            Lily58 (the encoder pins simply idle), so there is no separate
            download.

            Variants and controllers:
            - `default`, `vial`: **Helios**, **SVLinky**, **StemCell** (`.uf2`)
              and classic **Pro Micro** (`.hex`)
            - `vial-keebd`: **Helios**, **StemCell** (`.uf2`) and classic
              **Pro Micro** (`.hex`)
            - `vik`: **SVLinky** only

            Pro Micro Vial builds have some Vial extras (e.g. QMK Settings,
            tap dance, combos) turned off to fit the ATmega32U4.
          files: |
            firmware/*.uf2
            firmware/*.hex
            firmware/*.bin
