name: "Lily58 Firmware"

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - .github/workflows/lily58.yml
    - lily58/**
  # PRs build (and upload artifacts for test flashing) but never publish.
  pull_request:
    paths:
    - .github/workflows/lily58.yml
    - lily58/**

jobs:
  lily58-default-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: lily58
          keymap: default
          controller: helios
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: lily58-default-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  lily58-vial-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: lily58
          keymap: vial
          controller: helios
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: lily58-vial-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  lily58-vial-keebd-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: lily58
          keymap: vial-keebd
          controller: helios
          output-dir: build-output
          local-keymap-path: lily58/keymaps/vial-keebd
      - uses: actions/upload-artifact@v4
        with:
          name: lily58-vial-keebd-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  lily58-default-svlinky:
