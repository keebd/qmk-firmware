name: "Reviung 39 Firmware"

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - .github/workflows/reviung39.yml
    - reviung39/**
  # PRs build (and upload artifacts for test flashing) but never publish.
  pull_request:
    paths:
    - .github/workflows/reviung39.yml
    - reviung39/**

jobs:
  reviung39-default-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: reviung/reviung39
          keymap: default
          controller: helios
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviung39-default-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  reviung39-vial-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: reviung/reviung39
          keymap: vial
          controller: helios
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviung39-vial-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  reviung39-default-svlinky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: reviung/reviung39
          keymap: default
          controller: svlinky
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviung39-default-svlinky
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  reviung39-vial-svlinky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: reviung/reviung39
          keymap: vial
          controller: svlinky
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviung39-vial-svlinky
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  reviung39-default-promicro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: reviung/reviung39
          keymap: default
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviung39-default-promicro
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  reviung39-default-stemcell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: reviung/reviung39
          keymap: default
          controller: stemcell
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviung39-default-stemcell
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  reviung39-vial-promicro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: reviung/reviung39
          keymap: vial
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviung39-vial-promicro
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  reviung39-vial-stemcell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: reviung/reviung39
          keymap: vial
          controller: stemcell
          output-dir: build-output
      - uses: actions/upload-artifact@v4
        with:
          name: reviung39-vial-stemcell
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  reviung39-release:
    # Publish only from main; PR / branch runs just keep the build artifacts.
    if: github.ref == 'refs/heads/main'
    needs:
      - reviung39-default-helios
      - reviung39-vial-helios
      - reviung39-default-svlinky
      - reviung39-vial-svlinky
      - reviung39-default-promicro
      - reviung39-default-stemcell
      - reviung39-vial-promicro
      - reviung39-vial-stemcell
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true
      - name: Publish firmware as a rolling release
        # Pinned to a commit SHA (supply-chain hardening); Renovate bumps the
        # SHA + comment via PR. This action runs with contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: reviung39-firmware
          name: Reviung 39 Firmware (latest)
          body: |
            Latest Reviung 39 Firmware, built automatically from `main`.

            Download the firmware matching your keymap and controller, then flash it.
          files: |
            firmware/*.uf2
            firmware/*.hex
            firmware/*.bin
