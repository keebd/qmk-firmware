name: "Narfpad Firmware"

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - .github/workflows/narfpad.yml
    - narfpad/**
  # PRs build (and upload artifacts for test flashing) but never publish.
  pull_request:
    paths:
    - .github/workflows/narfpad.yml
    - narfpad/**

# Least privilege: build jobs only read the repo; each release job grants
# itself contents: write.
permissions:
  contents: read

jobs:
  narfpad-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: narfpad
          output-dir: build-output
          local-keyboard-path: narfpad
      - uses: actions/upload-artifact@v4
        with:
          name: narfpad-default
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  narfpad-vial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: narfpad
          keymap: vial
          output-dir: build-output
          local-keyboard-path: narfpad
      - uses: actions/upload-artifact@v4
        with:
          name: narfpad-vial
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  narfpad-release:
    # Publish only from main; PR / branch runs just keep the build artifacts.
    if: github.ref == 'refs/heads/main'
    needs:
      - narfpad-default
      - narfpad-vial
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true
      - name: Publish firmware as a rolling release
        # Pinned to a commit SHA (supply-chain hardening); Renovate bumps the
        # SHA + comment via PR. This action runs with contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: narfpad-firmware
          name: Narfpad Firmware (latest)
          body: |
            Latest Narfpad Firmware, built automatically from `main`.

            Download the firmware matching your keymap and controller, then flash it.
          files: |
            firmware/*.uf2
            firmware/*.hex
            firmware/*.bin
