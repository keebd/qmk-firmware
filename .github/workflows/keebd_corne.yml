name: "KEEBD Corne Firmware"

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - .github/workflows/keebd_corne.yml
    - keebd_corne/**
  # PRs build (and upload artifacts for test flashing) but never publish.
  pull_request:
    paths:
    - .github/workflows/keebd_corne.yml
    - keebd_corne/**

# Least privilege: build jobs only read the repo; each release job grants
# itself contents: write.
permissions:
  contents: read

jobs:
  keebd-corne-default-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: keebd_corne
          keymap: default
          controller: helios
          output-dir: build-output
          local-keyboard-path: keebd_corne
      - uses: actions/upload-artifact@v4
        with:
          name: keebd-corne-default-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  keebd-corne-vial-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: keebd_corne
          keymap: vial
          controller: helios
          output-dir: build-output
          local-keyboard-path: keebd_corne
      - uses: actions/upload-artifact@v4
        with:
          name: keebd-corne-vial-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  keebd-corne-default-svlinky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: keebd_corne
          keymap: default
          controller: svlinky
          output-dir: build-output
          local-keyboard-path: keebd_corne
      - uses: actions/upload-artifact@v4
        with:
          name: keebd-corne-default-svlinky
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  keebd-corne-vial-svlinky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: keebd_corne
          keymap: vial
          controller: svlinky
          output-dir: build-output
          local-keyboard-path: keebd_corne
      - uses: actions/upload-artifact@v4
        with:
          name: keebd-corne-vial-svlinky
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  keebd-corne-vial-mini-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: keebd_corne
          keymap: vial_mini
          controller: helios
          output-dir: build-output
          local-keyboard-path: keebd_corne
      - uses: actions/upload-artifact@v4
        with:
          name: keebd-corne-vial-mini-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  keebd-corne-vial-mini-svlinky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@vial-qmk
        with:
          keyboard: keebd_corne
          keymap: vial_mini
          controller: svlinky
          output-dir: build-output
          local-keyboard-path: keebd_corne
      - uses: actions/upload-artifact@v4
        with:
          name: keebd-corne-vial-mini-svlinky
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  keebd-corne-default-mini-helios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: keebd_corne
          keymap: default_mini
          controller: helios
          output-dir: build-output
          local-keyboard-path: keebd_corne
      - uses: actions/upload-artifact@v4
        with:
          name: keebd-corne-default-mini-helios
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  keebd-corne-default-mini-svlinky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: keebd/build-qmk-fw@main
        with:
          keyboard: keebd_corne
          keymap: default_mini
          controller: svlinky
          output-dir: build-output
          local-keyboard-path: keebd_corne
      - uses: actions/upload-artifact@v4
        with:
          name: keebd-corne-default-mini-svlinky
          path: |
            build-output/*.uf2
            build-output/*.hex
            build-output/*.bin
          if-no-files-found: error

  keebd_corne-release:
    # Publish only from main; PR / branch runs just keep the build artifacts.
    if: github.ref == 'refs/heads/main'
    needs:
      - keebd-corne-default-helios
      - keebd-corne-vial-helios
      - keebd-corne-default-svlinky
      - keebd-corne-vial-svlinky
      - keebd-corne-vial-mini-helios
      - keebd-corne-vial-mini-svlinky
      - keebd-corne-default-mini-helios
      - keebd-corne-default-mini-svlinky
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true
      - name: Publish firmware as a rolling release
        # Pinned to a commit SHA (supply-chain hardening); Renovate bumps the
        # SHA + comment via PR. This action runs with contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: keebd_corne-firmware
          name: KEEBD Corne Firmware (latest)
          body: |
            Latest KEEBD Corne Firmware, built automatically from `main`.

            Download the firmware matching your keymap and controller, then flash it.
            `*_mini` files are for the 3x5 Corne Mini (outer columns snapped off).
          files: |
            firmware/*.uf2
            firmware/*.hex
            firmware/*.bin
